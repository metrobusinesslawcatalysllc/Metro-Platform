<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Master Owner Portal</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, sans-serif; }
    .glass-panel { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function SuperMasterPortal() {
      const [branches, setBranches] = React.useState([
        { id: 'BR-101', name: 'Metro Capital Main', status: 'ACTIVE', volume: '$12.4M', traders: 142 },
        { id: 'BR-102', name: 'Apex FX Markets', status: 'ACTIVE', volume: '$6.0M', traders: 88 }
      ]);
      const [branchName, setBranchName] = React.useState('');

      const handleProvision = (e) => {
        e.preventDefault();
        if(!branchName.trim()) return;
        const newBranch = {
          id: `BR-${Math.floor(100 + Math.random() * 900)}`,
          name: branchName,
          status: 'ACTIVE',
          volume: '$0.00',
          traders: 0
        };
        setBranches([...branches, newBranch]);
        setBranchName('');
        alert(`Successfully provisioned ${newBranch.name}!`);
      };

      return (
        <div className="min-h-screen p-6 max-w-7xl mx-auto space-y-6">
          <header className="flex justify-between items-center border-b border-gray-800 pb-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center font-bold text-white shadow-lg shadow-purple-500/30">SM</div>
              <div>
                <h1 className="text-lg font-bold text-white">SUPER MASTER OWNER PORTAL</h1>
                <p className="text-xs text-purple-400">Global System Exposure & Liquidity Control</p>
              </div>
            </div>
            <span className="bg-purple-500/10 text-purple-400 border border-purple-500/20 px-3 py-1 rounded-full text-xs font-mono">GLOBAL ROOT ACCESS</span>
          </header>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="glass-panel p-4 rounded-xl">
              <p className="text-xs text-gray-400 uppercase font-semibold">Total Ecosystem Equity</p>
              <p className="text-2xl font-bold text-white mt-1">$2,732,450.00</p>
              <span className="text-xs text-emerald-400">+8.24% Net Growth</span>
            </div>
            <div className="glass-panel p-4 rounded-xl">
              <p className="text-xs text-gray-400 uppercase font-semibold">Active Broker Branches</p>
              <p className="text-2xl font-bold text-white mt-1">{branches.length} Provisioned</p>
              <span className="text-xs text-purple-400">cTrader Sockets Synced</span>
            </div>
            <div className="glass-panel p-4 rounded-xl">
              <p className="text-xs text-gray-400 uppercase font-semibold">24h Gross Volume</p>
              <p className="text-2xl font-bold text-white mt-1">$18.4M</p>
              <span className="text-xs text-gray-400">Latency: 38ms</span>
            </div>
            <div className="glass-panel p-4 rounded-xl">
              <p className="text-xs text-gray-400 uppercase font-semibold">Banking Treasuries</p>
              <p className="text-2xl font-bold text-white mt-1">4 Active Ledgers</p>
              <span className="text-xs text-emerald-400">Zero Loss Guard</span>
            </div>
          </div>

          <div className="glass-panel p-6 rounded-2xl space-y-4">
            <h2 className="text-sm font-bold text-white uppercase tracking-wider">Branch & Broker Provisioning Engine</h2>
            <form onSubmit={handleProvision} className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input type="text" placeholder="New Branch Name (e.g. Metro Prime)" value={branchName} onChange={(e)=>setBranchName(e.target.value)} className="bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500" />
              <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl px-4 py-2.5 transition-all shadow-lg shadow-purple-600/20">Spin New Branch</button>
            </form>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<SuperMasterPortal />);
  </script>
</body>
</html>
